<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D ESCOBAR - Catalogo</title>
    <style>
        /* Fondo verde oscuro mate idéntico a tu ejemplo */
        body { font-family: 'Segoe UI', sans-serif; background-color: #1b2e24; color: white; margin: 0; padding: 40px 20px; }
        
        .header-tienda { max-width: 1200px; margin: 0 auto 40px auto; padding-left: 10px; }
        .header-tienda h1 { font-size: 38px; font-weight: 800; margin: 0 0 5px 0; letter-spacing: -0.5px; }
        .header-tienda p { font-size: 14px; color: #a3b899; margin: 0; text-transform: uppercase; letter-spacing: 1.5px; font-weight: bold; }
        
        /* Cuadrícula organizada para los productos */
        .catalogo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 30px; max-width: 1200px; margin: 0 auto; }
        
        /* Tarjeta de cada producto */
        .producto-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 12px; display: flex; flex-direction: column; text-align: left; }
        
        /* Contenedor de la foto */
        .image-container { width: 100%; height: 200px; display: flex; justify-content: center; align-items: center; margin-bottom: 15px; background: rgba(0,0,0,0.15); border-radius: 8px; overflow: hidden; }
        .image-container img { max-width: 100%; max-height: 100%; object-fit: contain; }
        
        /* Detalles de los textos */
        .titulo-prod { font-size: 16px; font-weight: bold; margin: 5px 0 2px 0; color: #ffffff; }
        .estrellas { color: #f6ad55; font-size: 12px; margin: 2px 0; }
        .precio-prod { font-size: 18px; font-weight: bold; margin: 5px 0; color: #ffffff; }
        .envio-gratis { font-size: 12px; color: #52c41a; font-weight: bold; margin: 0 0 10px 0; letter-spacing: 0.5px; }
        
        /* Botón de compra minimalista */
        .btn-pagar { background: #ffffff; color: #1b2e24; border: none; padding: 10px 16px; font-size: 13px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: all 0.2s; text-align: center; }
        .btn-pagar:hover { background: #e2e8f0; }
    </style>
</head>
<body>

    <div class="header-tienda">
        <h1>Nuestro Catálogo</h1>
        <p>3D ESCOBAR • IMPRESIÓN 3D PREMIUM</p>
    </div>

    <div class="catalogo-grid">

        <!-- PRODUCTO 1: G19 FRAME CON TU RENDER REAL -->
        <div class="producto-card">
            <div class="image-container">
                <img src="https://ibb.co" alt="G19 Frame">
            </div>
            <div class="titulo-prod">G19 Frame</div>
            <div class="estrellas">★★★★★</div>
            <div class="precio-prod">$45.00</div>
            <div class="envio-gratis">✓ FREE Shipping</div>
            <button class="btn-pagar" onclick="irAStripe()">Comprar</button>
        </div>

        <!-- PRODUCTO 2 -->
        <div class="producto-card">
            <div class="image-container">
                <img src="https://unsplash.com" alt="Glock Extension">
            </div>
            <div class="titulo-prod">Glock Mag Extension</div>
            <div class="estrellas">★★★★★</div>
            <div class="precio-prod">$45.00</div>
            <div class="envio-gratis">✓ FREE Shipping</div>
            <button class="btn-pagar" onclick="irAStripe()">Comprar</button>
        </div>

        <!-- PRODUCTO 3 -->
        <div class="producto-card">
            <div class="image-container">
                <img src="https://unsplash.com" alt="Tactical Item">
            </div>
            <div class="titulo-prod">Tactical Frame (Gray)</div>
            <div class="estrellas">★★★★★</div>
            <div class="precio-prod">$45.00</div>
            <div class="envio-gratis">✓ FREE Shipping</div>
            <button class="btn-pagar" onclick="irAStripe()">Comprar</button>
        </div>

    </div>

    <script>
        function irAStripe() {
            // Enlace seguro de tu pasarela de Stripe [1.5]
            window["location"]["href"] = "https://stripe.com";
        }
    </script>

</body>
</html>
